topic_bridge:
  ros__parameters:
    server_name: control_server
    csm_name: topic_bridge
    master_name: csm_master
    # Give every bridge a unique controller_name and channel_name.
    channel_name: topic_bridge_control
    controller_name: local_xbox
    topic_name: /joy
    # joy / twist / string; string is topic-only.
    msg_type: joy
    csm_mode: topic
    # R1 carries generic priorities 1..100; arbitration belongs to the server.
    priority: 80
    timeout_ms: 2000
    # Both thresholds measure from the last activity, not from TIMEOUT entry.
    # 0 disables auto-disconnection; otherwise must exceed timeout_ms.
    disconnect_timeout_ms: 10000
    csm_status_timer_interval_ms: 100
    # Local receipt age; old commands are dropped after registration/send waits.
    input_timeout_ms: 250
    registration_timeout_ms: 1000
    registration_retry_ms: 200
